# Enterprise Knowledge Search (EKS) - Application Configuration

# Server Configuration
server.port=8080

# Database Configuration - PostgreSQL 17 with pgvector
spring.datasource.url=jdbc:postgresql://localhost:5432/enterprise_knowledge_search
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration
app.jwt.secret=enterprise-knowledge-search-super-secret-key-change-in-production-2026
app.jwt.expiration=86400000

# Ollama Configuration (Local LLM)
app.ollama.endpoint=http://localhost:11434
app.ollama.embedding-model=nomic-embed-text:latest
app.ollama.embedding-dims=768
app.ollama.llm-model=llama3:latest
app.ollama.request-timeout=60000

# Async Configuration
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.thread-name-prefix=eks-async-

# Logging Configuration
logging.level.root=INFO
logging.level.com.karthik.eks=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
