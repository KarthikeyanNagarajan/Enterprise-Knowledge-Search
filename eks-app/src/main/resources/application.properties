server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/enterprise_knowledge_search
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=enterprise-knowledge-search-super-secret-key-change-in-production-2026
app.jwt.expiration=86400000

app.ollama.endpoint=http://localhost:11434
app.ollama.embedding-model=nomic-embed-text:latest
app.ollama.embedding-dims=768
app.ollama.llm-model=llama3:latest
app.ollama.request-timeout=60000

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.chat.options.model=llama3:latest
spring.ai.ollama.embedding.options.model=nomic-embed-text:latest
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.table-name=vector_store

spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.thread-name-prefix=eks-async-

logging.level.root=INFO
logging.level.com.karthik.eks=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
